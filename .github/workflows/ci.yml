name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore DesktopPeople.slnx --configfile NuGet.Config
      - run: dotnet build DesktopPeople.slnx -c Release --no-restore
      - run: dotnet run --project tests/DesktopPeople.Tests/DesktopPeople.Tests.csproj -c Release --no-restore
